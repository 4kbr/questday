# Konfigurasi air — hot reload saat dev.
# Install: go install github.com/air-verse/air@latest

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "bin", "vendor", "migrations"]
  delay = 300
  stop_on_error = true

[misc]
  clean_on_exit = true
