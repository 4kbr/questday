# Infra untuk pengembangan lokal (level monorepo).
# Hanya dependency eksternal (database, dll). App-nya sendiri dijalankan via
# `make dev` di apps/backend supaya hot-reload (air) enak dipakai.
#
# Cara mudah (root Makefile):  make up / make down / make reset
# Manual:                      docker compose -f docker-compose.dev.yml up -d
#
# Nilai di bawah bisa di-override lewat .env.docker (`make env-docker` untuk buat
# dari template). Tanpa .env.docker, default `questday` tetap dipakai.

services:
  postgres:
    image: postgres:16-alpine
    container_name: questday_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questday}
      POSTGRES_DB: ${POSTGRES_DB:-questday}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - questday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questday} -d ${POSTGRES_DB:-questday}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO (opsional, nanti kalau perlu):
  #   adminer / pgweb  -> UI lihat isi DB
  #   redis            -> cache / rate-limit / job queue

volumes:
  questday_pgdata:
